<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>小学英语自然拼读</title>
<link rel="manifest" href="phonics-manifest.json">
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="拼读">
<link rel="apple-touch-icon" href="p-icon-192.png">
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --line:#334155; --txt:#e2e8f0; --muted:#94a3b8;
    --blue:#1d4ed8; --red:#ef4444; --orange:#f59e0b; --green:#16a34a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:"Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
  header{position:sticky;top:0;z-index:20;background:#111c33;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px}
  header h1{font-size:16px;margin:0;flex:1}
  header .ic{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer}
  .wrap{max-width:760px;margin:0 auto;padding:14px}
  .tabs{display:flex;gap:8px;margin-bottom:10px}
  .tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:14px;cursor:pointer}
  .tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  textarea{width:100%;min-height:96px;resize:vertical;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;line-height:1.5}
  .bar{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .bar button{padding:10px 14px;border-radius:10px;border:none;font-size:14px;cursor:pointer;background:var(--blue);color:#fff}
  .bar button.ghost{background:var(--panel);color:var(--txt);border:1px solid var(--line)}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
  .sent-hint{font-size:12.5px;color:var(--muted);background:#0f172a;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0 12px 8px;line-height:1.6}
  .scan-status{font-size:12px;color:#fbbf24;margin-top:6px;min-height:16px}
  .sec-title{font-size:13px;color:var(--muted);margin:18px 0 8px;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .wcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:center}
  .wcard .em{font-size:34px;line-height:1.1}
  .wcard .w{font-size:15px;margin-top:4px;font-weight:600}
  .wcard .cn{font-size:12px;color:var(--muted)}
  .wcard.hard{border-color:var(--red)}
  .wcard .ipaline{margin:6px 0 4px;gap:6px}
  .wcard .ipaline .ph{font-size:13px;padding:3px 8px;border-radius:8px}
  .wcard .ipa-play{display:block;margin:6px auto 0;background:var(--orange);color:#1a1205;border:none;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;font-weight:700}
  .wcard .ipa-row{display:flex;gap:6px;justify-content:center;margin:6px auto 0;flex-wrap:wrap}
  .wcard .ipa-row .ipa-play{margin:0;display:inline-flex;align-items:center;gap:3px}
  .wcard .ipa-fb{background:#3b82f6;color:#fff;border:none;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:3px}
  .wcard .ipa-fb.rec{background:#ef4444;animation:pulseRec 1s infinite}
  .wcard .ipa-fb.busy{background:#f59e0b;cursor:wait}
  @keyframes pulseRec{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  /* 跟读反馈：toast + 礼花 */
  .rec-toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);background:rgba(15,23,42,.94);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;z-index:9999;display:flex;align-items:center;gap:8px;box-shadow:0 8px 28px rgba(0,0,0,.5);max-width:86vw;text-align:center;line-height:1.5}
  .rec-toast .dot{width:10px;height:10px;border-radius:50%;background:#ef4444;animation:pulseRec 1s infinite;flex:0 0 auto}
  .rec-toast.ok{background:linear-gradient(135deg,#10b981,#059669);font-size:16px;padding:14px 22px}
  .rec-toast.no{background:linear-gradient(135deg,#ef4444,#b91c1c)}
  .confetti-canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:9998}
  /* 详情弹窗 */
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:40;align-items:flex-end}
  .sheet.show{display:flex}
  .sheet .box{background:var(--bg);width:100%;max-width:760px;margin:0 auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
  .sheet .top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .sheet .ltr{font-size:40px;font-weight:800;color:var(--blue)}
  .sheet .em{font-size:48px}
  .sheet .close{margin-left:auto;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 12px;cursor:pointer}
  .phonics{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0;font-size:26px;font-weight:700}
  .phonics .g-r{color:var(--red)} .phonics .g-b{color:var(--blue)}
  .ipaline{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px 0 2px}
  .ipaline .ph{background:rgba(245,158,11,.15);border:1px solid var(--orange);color:var(--orange);border-radius:10px;padding:6px 12px;font-size:20px;cursor:pointer}
  .ipaline .slash{color:var(--muted);font-size:20px;align-self:center}
  .cn{text-align:center;color:var(--muted);font-size:14px;margin-bottom:10px}
  .actions{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;justify-content:center}
  .actions button{border:none;border-radius:12px;padding:11px 16px;font-size:15px;cursor:pointer}
  .actions .play{background:var(--orange);color:#1a1205;font-size:22px;width:58px;height:58px;border-radius:50%}
  .actions .rec{background:#a855f7;color:#fff;font-size:20px;width:58px;height:58px;border-radius:50%}
  .actions .rec.on{background:var(--red)}
  .actions .rec.rec{background:#ef4444;animation:pulseRec 1s infinite}
  .actions .mini{background:var(--panel);color:var(--txt);border:1px solid var(--line)}
  /* 句子分析 */
  .sent{line-height:2.4;font-size:17px;word-break:break-word}
  .sent .tok{display:inline-block;margin:0 2px;text-align:center;vertical-align:top}
  .sent .tok .w{font-weight:600}
  .sent .tok .meta{display:block;font-size:11px;color:var(--muted);font-weight:400}
  .sent .tok .role{display:block;font-size:10px;padding:1px 5px;border-radius:6px;margin-top:1px}
  .role.subj{background:#1e3a8a;color:#bfdbfe}
  .role.pred{background:#14532d;color:#bbf7d0}
  .role.obj{background:#78350f;color:#fde68a}
  .role.attr{background:#581c87;color:#e9d5ff}
  .role.advr{background:#0e7490;color:#a5f3fc}
  .role.comp{background:#9d174d;color:#fbcfe8}
  .role.other{background:#334155;color:#cbd5e1}
  .tok.hard .w{color:var(--red)}
  .tok.hard .meta{color:var(--red)}
  /* 单词本 */
  .wb{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:40;align-items:center;justify-content:center;padding:20px}
  .wb.show{display:flex}
  .wb .box{background:var(--bg);border-radius:16px;padding:18px;width:100%;max-width:520px;max-height:80vh;overflow:auto}
  .wb .item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .wb .item .em{font-size:24px}.wb .item .w{font-weight:600}.wb .item .cn{color:var(--muted);font-size:13px}
  .wb .item button{margin-left:auto;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:5px 10px;cursor:pointer}
  /* 聊天 */
  .fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;width:54px;height:54px;border-radius:50%;border:none;background:var(--blue);color:#fff;font-size:24px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4)}
  .chat{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;display:none;flex-direction:column;max-height:78vh;max-width:760px;margin:0 auto}
  .chat.show{display:flex}
  .chat-hd{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .chat-hd .tt{font-size:14px;font-weight:600;flex:1}
  .chat-hd .x{background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:4px 10px;cursor:pointer}
  .chat-msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:88%;padding:9px 12px;border-radius:12px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  .msg.u{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
  .msg.a{background:var(--bg);color:var(--txt);align-self:flex-start;border-bottom-left-radius:4px;line-height:1.7}
  .msg.sys{background:transparent;color:var(--muted);font-size:12px;align-self:center;text-align:center}
  .msg.a .speak{display:inline-block;margin-top:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--txt)}
  .msg.a .hd{font-weight:700;margin:6px 0 4px;color:#fbbf24}
  .msg.a ul{margin:4px 0;padding-left:20px}
  .msg.a li{margin:2px 0}
  .msg.a b{color:#fde68a}
  /* 句子成分思维导图（豆包式树） */
  .tree{margin:10px 12px;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;font-size:14.5px;line-height:1.8;color:var(--txt);overflow-x:auto}
  .tree .hd{font-weight:700;color:#fbbf24;margin:2px 0 6px}
  .tree .hd.h1{font-size:17px} .tree .hd.h2{font-size:16px} .tree .hd.h3{font-size:15px}
  .tree ul{margin:3px 0;padding-left:18px;list-style:disc}
  .tree li{margin:2px 0}
  .tree b{color:#fde68a}
  .chat-quick{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line)}
  .chat-quick button{background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 9px;font-size:12px;cursor:pointer}
  .chat-in{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--line);align-items:flex-end;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  .chat-in textarea{flex:1;resize:none;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;height:44px;max-height:120px;line-height:1.4}
  .chat-in button{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:0 14px;height:44px;cursor:pointer;font-size:13px}
  .chat-set{display:none;padding:12px;border-top:1px solid var(--line);flex-direction:column;gap:8px}
  .chat-set.show{display:flex}
  .chat-set label{font-size:12px;color:var(--muted)}
  .chat-set input{background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px}
  .chat-set .row{display:flex;gap:8px;align-items:center}
  .chat-set .save{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:8px 14px;cursor:pointer}
  .chat-set .hint{font-size:11px;color:var(--muted)}
  .gear{margin-left:4px;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13px}
</style>
</head>
<body>
<header>
  <h1>小学英语自然拼读</h1>
  <button class="ic" id="openWb">📚 单词本</button>
</header>

<div class="wrap">
  <div class="tabs">
    <button id="tabText" class="on">📄 短文 / 单词</button>
    <button id="tabSent">✍️ 句子分析</button>
  </div>
  <textarea id="input" placeholder="粘贴或输入一篇英语小短文，或一句话…（语音可用输入法键盘的🎤说）"></textarea>
  <div class="bar">
    <button id="btnAnalyze">🔍 分析</button>
    <button class="ghost" id="btnScan">📷 扫描输入</button>
    <button class="ghost" id="btnClear">🗑 清空</button>
    <input type="file" id="scanFile" accept="image/*" capture="environment" style="display:none">
  </div>
  <div id="scanStatus" class="scan-status"></div>
  <div class="hint">提示：语音输入请直接点输入框 → 切到搜狗等输入法 → 点键盘上的🎤说（页面不再做麦克风按钮）。📷 扫描＝手机/电脑浏览器本地识别（PaddleOCR.js），无需联网服务器、首次加载模型约几十 MB。</div>

  <div class="sec-title" id="resultTitle" style="display:none"></div>
  <div class="grid" id="wordGrid"></div>
  <div id="sentenceOut"></div>
</div>

<!-- 单词详情 -->
<div class="sheet" id="sheet">
  <div class="box">
    <div class="top">
      <div class="ltr" id="dLtr">a</div>
      <div class="em" id="dEm">🪓</div>
      <button class="close" id="dClose">关闭</button>
    </div>
    <div class="phonics" id="dPhonics"></div>
    <div class="ipaline" id="dIpa"></div>
    <div class="cn" id="dCn">斧头</div>
    <div class="actions">
      <button class="play" id="dPlay" title="完整拼读">▶️</button>
      <button class="rec" id="dRec" title="跟读录音">🎤</button>
      <button class="mini" id="dAdd">📌 加到单词本</button>
      <button class="mini" id="dShare">📤 分享</button>
      <button class="mini" id="dAsk">💬 问 AI</button>
    </div>
  </div>
</div>

<!-- 单词本 -->
<div class="wb" id="wb">
  <div class="box">
    <div style="display:flex;align-items:center;margin-bottom:8px"><b style="flex:1">我的单词本</b><button class="close" id="wbClose" style="background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:4px 12px;cursor:pointer">关闭</button></div>
    <div id="wbList"></div>
  </div>
</div>

<button class="fab" id="chatFab">💬</button>
<div class="chat" id="chat">
  <div class="chat-hd">
    <span class="tt">💬 互动讲解</span>
    <button class="gear" id="chatGear">⚙</button>
    <button class="x" id="chatClose">×</button>
  </div>
  <div class="chat-msgs" id="chatMsgs"></div>
  <div class="chat-quick" id="chatQuick">
    <button data-q="这个词怎么记最简单？给我一个顺口溜或动作">🧠 怎么记</button>
    <button data-q="用这个词的简单例句讲讲">📝 例句</button>
    <button data-q="它和哪些小学词容易混淆？">🔍 易混词</button>
    <button data-q="清空对话">🗑 清空</button>
  </div>
  <div class="chat-set" id="chatSet">
    <label>API 地址（OpenAI 兼容，已预填 Agnes AI）</label>
    <input id="setEndpoint" value="https://apihub.agnes-ai.com/v1/chat/completions">
    <label>模型名（已预填 Agnes 文本模型）</label>
    <input id="setModel" value="agnes-2.0-flash">
    <label>API Key（仅存本地浏览器，不会上传；Agnes 可免费领）</label>
    <input id="setKey" type="password" placeholder="在 platform.agnes-ai.com 创建 Key">
    <div class="sec-title" style="margin:14px 0 6px">🎤 讯飞语音识别（跟读必填）</div>
    <label>讯飞 APPID</label>
    <input id="setXfAppid" placeholder="在 console.xfyun.cn 免费创建应用获取">
    <label>讯飞 APIKey</label>
    <input id="setXfApikey" type="password" placeholder="应用的 APIKey">
    <label>讯飞 APISecret</label>
    <input id="setXfSecret" type="password" placeholder="应用的 APISecret">
    <div class="row"><button class="save" id="setSave">保存</button><button class="ghost" id="setTestXf" type="button">🔧 测试讯飞</button><span class="hint">没 Key？用 📋 复制提示词去 WorkBuddy 问</span></div>
  </div>
  <div class="chat-in">
    <textarea id="chatInput" placeholder="不懂就问，比如：为什么 axe 的 a 发 /æ/？"></textarea>
    <button id="chatSend">发送</button>
  </div>
</div>

<script>
/* ===================== 数据：小学词表 MVP（人教版三四年级核心） ===================== */
/* w:单词 ipa:音标 ph:音素数组 gp:字母颜色拆分(c:r红/vowel, b:辅音蓝) cn:中文 em:emoji */
const WORDS = [
  {w:"axe",ipa:"/æks/",ph:["æ","ks"],gp:[{t:"a",c:"r"},{t:"x",c:"b"}],cn:"斧头",em:"🪓"},
  {w:"cat",ipa:"/kæt/",ph:["k","æ","t"],gp:[{t:"c",c:"b"},{t:"a",c:"r"},{t:"t",c:"b"}],cn:"猫",em:"🐱"},
  {w:"dog",ipa:"/dɒg/",ph:["d","ɒ","g"],gp:[{t:"d",c:"b"},{t:"o",c:"r"},{t:"g",c:"b"}],cn:"狗",em:"🐶"},
  {w:"pig",ipa:"/pɪg/",ph:["p","ɪ","g"],gp:[{t:"p",c:"b"},{t:"i",c:"r"},{t:"g",c:"b"}],cn:"猪",em:"🐷"},
  {w:"sun",ipa:"/sʌn/",ph:["s","ʌ","n"],gp:[{t:"s",c:"b"},{t:"u",c:"r"},{t:"n",c:"b"}],cn:"太阳",em:"☀️"},
  {w:"run",ipa:"/rʌn/",ph:["r","ʌ","n"],gp:[{t:"r",c:"b"},{t:"u",c:"r"},{t:"n",c:"b"}],cn:"跑",em:"🏃"},
  {w:"red",ipa:"/red/",ph:["r","e","d"],gp:[{t:"r",c:"b"},{t:"e",c:"r"},{t:"d",c:"b"}],cn:"红色",em:"🔴"},
  {w:"bed",ipa:"/bed/",ph:["b","e","d"],gp:[{t:"b",c:"b"},{t:"e",c:"r"},{t:"d",c:"b"}],cn:"床",em:"🛏️"},
  {w:"pen",ipa:"/pen/",ph:["p","e","n"],gp:[{t:"p",c:"b"},{t:"e",c:"r"},{t:"n",c:"b"}],cn:"钢笔",em:"🖊️"},
  {w:"ten",ipa:"/ten/",ph:["t","e","n"],gp:[{t:"t",c:"b"},{t:"e",c:"r"},{t:"n",c:"b"}],cn:"十",em:"🔟"},
  {w:"big",ipa:"/bɪg/",ph:["b","ɪ","g"],gp:[{t:"b",c:"b"},{t:"i",c:"r"},{t:"g",c:"b"}],cn:"大的",em:"🐘"},
  {w:"sit",ipa:"/sɪt/",ph:["s","ɪ","t"],gp:[{t:"s",c:"b"},{t:"i",c:"r"},{t:"t",c:"b"}],cn:"坐",em:"🪑"},
  {w:"hit",ipa:"/hɪt/",ph:["h","ɪ","t"],gp:[{t:"h",c:"b"},{t:"i",c:"r"},{t:"t",c:"b"}],cn:"打",em:"👊"},
  {w:"map",ipa:"/mæp/",ph:["m","æ","p"],gp:[{t:"m",c:"b"},{t:"a",c:"r"},{t:"p",c:"b"}],cn:"地图",em:"🗺️"},
  {w:"bag",ipa:"/bæg/",ph:["b","æ","g"],gp:[{t:"b",c:"b"},{t:"a",c:"r"},{t:"g",c:"b"}],cn:"包",em:"🎒"},
  {w:"hat",ipa:"/hæt/",ph:["h","æ","t"],gp:[{t:"h",c:"b"},{t:"a",c:"r"},{t:"t",c:"b"}],cn:"帽子",em:"🎩"},
  {w:"sad",ipa:"/sæd/",ph:["s","æ","d"],gp:[{t:"s",c:"b"},{t:"a",c:"r"},{t:"d",c:"b"}],cn:"伤心的",em:"😢"},

/* ===================== 发音（Web Speech + 百度/有道在线兜底） ===================== */
function speakWeb(text, voice){
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=0.85;
  if(voice) u.voice=voice;
  try{ window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); return true; }catch(e){ return false; }
}
function speakBaidu(text){
  // 兜底：百度翻译在线 TTS（国内可达、免 key），失败再兜底有道
  const url='https://fanyi.baidu.com/gettts?lan=en&text='+encodeURIComponent(text)+'&spd=3&source=web';
  const a=new Audio(url);
  a.onerror=()=>{
    const u2='https://dict.youdao.com/dictvoice?type=2&audio='+encodeURIComponent(text);
    const a2=new Audio(u2);
    a2.onerror=()=>alert('朗读不可用：浏览器未找到英文语音包，且在线朗读也失败。请检查网络后重试。');
    a2.play().catch(()=>{});
  };
  a.play().catch(()=>{});
}
function speakEn(text){
  if(!text) return;
  if(!('speechSynthesis' in window)){ speakBaidu(text); return; }
  const tryWeb = (voices)=>{
    const en=voices.find(v=>/^en/i.test(v.lang));
    return en ? speakWeb(text, en) : false;
  };
  if(tryWeb(window.speechSynthesis.getVoices())) return;
  // 等待 voiceschanged（安卓/微信常常延迟才返回语音列表）
  let done=false;
  const finish=()=>{ if(done) return; done=true;
    if(!tryWeb(window.speechSynthesis.getVoices())) speakBaidu(text);
  };
  window.speechSynthesis.addEventListener('voiceschanged', finish, {once:true});
  setTimeout(finish, 1200);
}
function playWord(wordObj){
  // 课标词有 .ph 音素列表 → 按音素拟声拼读；高频词只有 IPA → 整词朗读
  if (wordObj.ph && wordObj.ph.length){
    const seq=wordObj.ph.map(p=>IPA_MAP[p]||p).join(' ');
    speakEn(seq);
  } else {
    speakEn(wordObj.w);
  }
}

let _reco=null;
function getReco(){
  if(_reco!==null) return _reco;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ _reco=false; return false; }
  const r = new SR();
  r.lang='en-US';
  r.interimResults=false;
  r.maxAlternatives=5;
  r.continuous=false;
  _reco = r;
  return r;
}
function normWord(s){ return (s||'').toLowerCase().replace(/[^a-z]/g,''); }
function showRecToast(msg, kind){
  const t=document.createElement('div');
  t.className='rec-toast '+(kind||'');
  if(kind==='rec') t.innerHTML='<span class="dot"></span>'+msg;
  else t.textContent=msg;
  document.body.appendChild(t);
  if(kind==='rec') return t; // 录音中持续显示，调用方手动移除
  const dur = kind==='ok'? 1600 : (kind==='no'? 4000 : 2200); // 错误提示停留更久，方便截屏错误码
  setTimeout(()=>{ t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(()=>t.remove(),320); }, dur);
}
/* 礼花 canvas（不阻塞主线程，自动回收） */
const fireConfetti = (function(){
  let canvas=null, ctx=null, raf=null, parts=[];
  function ensure(){
    if(canvas) return;
    canvas=document.createElement('canvas');
    canvas.className='confetti-canvas';
    canvas.width = window.innerWidth * (window.devicePixelRatio||1);
    canvas.height= window.innerHeight* (window.devicePixelRatio||1);
    canvas.style.width ='100vw';
    canvas.style.height='100vh';
    document.body.appendChild(canvas);
    ctx = canvas.getContext('2d');
    ctx.scale(window.devicePixelRatio||1, window.devicePixelRatio||1);
    window.addEventListener('resize', ()=>{
      canvas.width = window.innerWidth*(window.devicePixelRatio||1);
      canvas.height= window.innerHeight*(window.devicePixelRatio||1);
      ctx.scale(window.devicePixelRatio||1, window.devicePixelRatio||1);
    });
  }
  function spawn(count, big){
    ensure();
    const colors=['#fbbf24','#f87171','#60a5fa','#34d399','#a78bfa','#fb923c','#f472b6','#22d3ee','#facc15'];
    const cx=window.innerWidth/2, cy=window.innerHeight*0.35;
    const n = count || 90;
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2;
      const sp = (big? 5:3) + Math.random()*7;
      parts.push({
        x:cx, y:cy,
        vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - (big?5:3),
        g:0.18, life:70+Math.random()*50,
        c:colors[(Math.random()*colors.length)|0],
        r:3+Math.random()*5,
        rot:Math.random()*Math.PI, vr:(Math.random()-.5)*0.3,
        sh:Math.random()<0.3
      });
    }
    if(!raf) loop();
  }
  function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    parts = parts.filter(p=>p.life>0);
    for(const p of parts){
      p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life--;
      ctx.save();
      ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.c;
      if(p.sh){ ctx.fillRect(-p.r,-p.r*.4, p.r*2, p.r*.8); }
      else { ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.fill(); }
      ctx.restore();
    }
    if(parts.length){ raf=requestAnimationFrame(loop); }
    else { raf=null; ctx.clearRect(0,0,canvas.width,canvas.height); }
  }
  return { big: ()=>spawn(120,true), small: ()=>spawn(50,false) };
})();
function editDist(a,b){
  const m=a.length, n=b.length;
  if(!m) return n; if(!n) return m;
  const dp=Array.from({length:m+1},(_,i)=>[i].concat(Array(n).fill(0)));
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1])+1;
  }
  return dp[m][n];
}
/* 跟读结果比对 + 礼花反馈（讯飞 / WebSpeech 共用） */
/* 撒礼花时交替播放 "perfect" 和 "Good job" */
let _praiseToggle=false;
function praiseAndConfetti(isBig){
  _praiseToggle=!_praiseToggle;
  var praise=_praiseToggle ? 'perfect' : 'Good job';
  speakEn(praise);
  if(isBig) fireConfetti.big(); else fireConfetti.small();
}
function judgeFollow(btn, heard, targetWord){
  btn.classList.remove('rec','busy');
  const h = normWord(heard);
  const t = normWord(targetWord);
  if(!t){ showRecToast('单词为空', 'no'); return; }
  if(!h){ showRecToast('没听到声音，点 🎤 后立刻大声读出单词（不要等）', 'no'); return; }
  if(h===t){
    btn.classList.add('busy');
    showRecToast('🎉 读对啦！', 'ok');
    praiseAndConfetti(true);
    setTimeout(()=>btn.classList.remove('busy'), 700);
    return;
  }
  // 宽松：允许加 s/es（单复数）或 1-2 个字母误差
  const d = editDist(h, t);
  const tol = Math.max(1, Math.floor(t.length*0.25));
  if(d<=tol || (d===1 && Math.abs(h.length-t.length)<=1)){
    btn.classList.add('busy');
    showRecToast('很接近！小礼花送上 🎊', 'ok');

    setTimeout(()=>btn.classList.remove('busy'), 700);
  } else {

}

/* ---- Web Speech API 实现（有 Google 引擎的设备兜底） ---- */
function startWebFollow(btn, targetWord){
  const reco = getReco();
  if(!reco){
    showRecToast('当前浏览器不支持 Web 语音识别，请在 ⚙ 设置里填「讯飞语音识别」三件套', 'no');
    return;
  }
  try{ reco.abort(); }catch(e){}
  let heard='', done=false;
  const end=(h)=>{ if(done) return; done=true; judgeFollow(btn, h, targetWord); };
  reco.onresult = (ev)=>{
    let best='';
    for(let i=ev.results.length-1;i>=0;i--){
      const r=ev.results[i];
      for(let j=0;j<r.length;j++){
        const alt=(r[j].transcript||'').trim();
        if(normWord(alt)===normWord(targetWord)){ best=alt; break; }
      }
      if(best) break;
    }
    if(!best) best=(ev.results[ev.results.length-1][0].transcript||'').trim();
    heard=best;
  };
  reco.onerror = (ev)=>{
    if(done) return; done=true;
    btn.classList.remove('rec');
    const msg = ev.error==='not-allowed' ? '请允许麦克风权限（地址栏左侧小锁）' :
                ev.error==='no-speech' ? '没听到声音，再试一次' :
                ev.error==='audio-capture' ? '没有可用麦克风' :
                ev.error==='network' ? '需要联网才能识别，请检查网络' :
                '识别失败：'+(ev.error||'未知错误');
    showRecToast(msg, 'no');
  };
  reco.onend = ()=>{ end(heard); };
  try{ reco.start(); }
  catch(e){ done=true; btn.classList.remove('rec'); showRecToast('启动失败，请再点一次', 'no'); }
  // 超时兜底：无引擎设备可能既不报错也不结束，避免卡在录音态
  setTimeout(()=>{
    if(!done){ done=true; btn.classList.remove('rec'); showRecToast('识别无响应，请确认已填「讯飞语音识别」密钥（国产安卓必需）', 'no'); }
  }, 8000);
}

/* ---- 讯飞语音听写（iat）实现：纯前端，国产安卓可用 ---- */
function xfCreds(){
  return {
    appid: localStorage.getItem('xf_appid')||'',
    apiKey: localStorage.getItem('xf_apikey')||'',
    apiSecret: localStorage.getItem('xf_apisecret')||''
  };
}
function xfReady(){ const c=xfCreds(); return !!(c.appid && c.apiKey && c.apiSecret); }
function xfB64Bytes(bytes){ return btoa(String.fromCharCode.apply(null, bytes)); }
async function xfSign(text, secret){
  const enc=new TextEncoder().encode(text);
  const key=await crypto.subtle.importKey('raw', new TextEncoder().encode(secret), {name:'HMAC', hash:'SHA-256'}, false, ['sign']);
  const sig=await crypto.subtle.sign('HMAC', key, enc);
  return btoa(String.fromCharCode.apply(null, new Uint8Array(sig)));
}
async function xfAuthUrl(){
  const c=xfCreds();
  const host='iat-api.xfyun.cn';
  const date=new Date().toUTCString();
  const signStr=await xfSign('host: '+host+'\ndate: '+date+'\nGET /v2/iat HTTP/1.1', c.apiSecret);
  const authOrigin='api_key="'+c.apiKey+'", algorithm="hmac-sha256", headers="host date request-line", signature="'+signStr+'"';
  const authorization=xfB64Bytes(new TextEncoder().encode(authOrigin));
  return 'wss://'+host+'/v2/iat?authorization='+encodeURIComponent(authorization)+'&date='+encodeURIComponent(date)+'&host='+encodeURIComponent(host);
}
function startXfFollow(btn, targetWord){
  btn.classList.add('rec');
  const tip=showRecToast('请大声读：'+targetWord, 'rec');
  let heard='', stopped=false, stopRec=null;
  const finish=(showMsg)=>{
    if(stopped) return; stopped=true;
    btn.classList.remove('rec');
    if(tip) tip.remove();
    if(showMsg){ showRecToast(showMsg, 'no'); return; } // 讯飞明确报错：只显示错误码，不再叠加"没听清"
    judgeFollow(btn, heard, targetWord);
  };
  xfAuthUrl().then(url=>{
    const ws=new WebSocket(url);
    ws.onopen=()=>{
      navigator.mediaDevices.getUserMedia({audio:{sampleRate:16000, channelCount:1, echoCancellation:true, noiseSuppression:true}})
      .then(stream=>{
        const AudioCtx=window.AudioContext||window.webkitAudioContext;
        const ctx=new AudioCtx({sampleRate:16000}); // 强制 16k 采样（Chrome/Android 支持）
        const source=ctx.createMediaStreamSource(stream);
        const processor=ctx.createScriptProcessor(4096,1,1);
        const frameSize=1280; // 40ms @16k*16bit
        let partial=new Uint8Array(0);
        let frameIdx=0;
        processor.onaudioprocess=(e)=>{
          if(ws.readyState!==WebSocket.OPEN) return;
          const input=e.inputBuffer.getChannelData(0);
          const pcm=new Int16Array(input.length);
          for(let i=0;i<input.length;i++){
            const s=Math.max(-1,Math.min(1,input[i]));
            pcm[i]= s<0 ? s*0x8000 : s*0x7FFF;
          }
          const buf=new Uint8Array(pcm.buffer);
          const all=new Uint8Array(partial.length+buf.length);
          all.set(partial,0); all.set(buf,partial.length);
          const full=Math.floor(all.length/frameSize)*frameSize;
          for(let off=0; off<full; off+=frameSize){
            const slice=all.subarray(off, off+frameSize);
            const b64=xfB64Bytes(slice);
            // 讯飞 iat v2 协议：第一帧含 common.business.data，中间帧只 data
            let msg;
            if(frameIdx===0){
              msg={common:{app_id:xfCreds().appid}, business:{language:'en', domain:'iat'}, data:{status:0, format:'audio/L16;rate=16000', encoding:'raw', audio:b64}};
            } else {
              msg={data:{status:1, format:'audio/L16;rate=16000', encoding:'raw', audio:b64}};
            }
            ws.send(JSON.stringify(msg));
            frameIdx++;
          }
          partial=all.subarray(full);
        };
        source.connect(processor); processor.connect(ctx.destination);
        stopRec=()=>{
          try{
            processor.disconnect(); source.disconnect();
            stream.getTracks().forEach(t=>t.stop()); ctx.close();
          }catch(e){}
          if(ws.readyState===WebSocket.OPEN){
            try{ ws.send(JSON.stringify({data:{status:2}})); }catch(e){}
          }
          setTimeout(()=>{ try{ ws.close(); }catch(e){} }, 400);
        };
        // 固定录音 6 秒后自动结束（适合读单个单词）
        setTimeout(()=>{ if(!stopped) stopRec(); }, 6000);
      })
      .catch(err=>{ finish('无法访问麦克风：'+(err.message||err.name)); try{ ws.close(); }catch(e){} });
    };
    ws.onmessage=(ev)=>{
      let data; try{ data=JSON.parse(ev.data); }catch(e){ return; }
      if(data.code!==0){ finish('讯飞识别错误 '+data.code+'：'+(data.message||'')); return; }
      if(data.data && data.data.result){
        const wsArr=data.data.result.ws;
        let text=''; for(const w of wsArr) for(const c of w.cw) text+=c.w;
        heard+=text;
      }
      if(data.data && data.data.status===2){
        if(stopRec) stopRec(); else try{ ws.close(); }catch(e){}
        finish();
      }
    };
    ws.onerror=()=>{ finish('讯飞连接失败（检查网络或密钥）'); };
    ws.onclose=()=>{ if(!stopped) finish(); };
  }).catch(err=>{
    btn.classList.remove('rec');
    if(tip) tip.remove();
    showRecToast('讯飞鉴权失败：'+(err.message||err), 'no');
  });
}

/* ===================== 提取单词 ===================== */
function wordInfo(w){
  const lw = w.toLowerCase();
  if (WORD_MAP[lw]) return WORD_MAP[lw];
  if (IPA_EXT[lw])  return {w: lw, ipa: IPA_EXT[lw]};
  return null;
}
function extractWords(text){
  const raw=(text.toLowerCase().match(/[a-z]+/g)||[]);
  const seen=new Set(), out=[];
  raw.forEach(w=>{ if(seen.has(w))return; seen.add(w);
    const info = wordInfo(w);
    out.push({w, info});
  });
  return out;
}

/* ===================== 句子分析：本地音标 + Agnes 成分思维导图 ===================== */
function analyzeSentence(sent){
  sentenceOut.innerHTML=''; wordGrid.innerHTML=''; resultTitle.style.display='none';
  curContext='句子：「'+sent+'」';
  renderSentence(tagLocal(sent)); // 音标先行（离线、可点读）
  const key=localStorage.getItem('phx_key');
  const ep=localStorage.getItem('phx_endpoint')||'https://apihub.agnes-ai.com/v1/chat/completions';
  const model=localStorage.getItem('phx_model')||'agnes-2.0-flash';
  const showHint=(msg)=>{ sentenceOut.insertAdjacentHTML('afterbegin','<div class="sent-hint">'+msg+'</div>'); };
  if(!key){ showHint('💡 句子成分思维导图需 Agnes Key：去聊天面板 ⚙ 填入（免费领）即可自动生成；当前仅显示音标。'); return; }
  const loading=document.createElement('div'); loading.className='sent-hint'; loading.textContent='🌳 正在生成句子成分思维导图…'; sentenceOut.appendChild(loading);
  fetchTree(sent, key, ep, model).then(md=>{
    loading.remove();
    sentenceOut.insertAdjacentHTML('beforeend','<div class="tree">'+renderMd(md)+'</div>');
  }).catch(e=>{
    loading.remove();
    showHint('⚠️ 成分树生成失败：'+e.message+'（检查 ⚙ Key / 网络）');
  });
}
/* 按"思维导图"逻辑让 Agnes 把句子逐层拆成成分树，返回 Markdown 文本 */
async function fetchTree(sent, key, ep, model){
  const sys='你是小学英语语法老师。请像"思维导图"一样，把句子逐层拆解成一棵成分树，严格用 Markdown 输出，不要代码块、不要多余解释。\n规则：\n1) 根节点写：## 整句：<原句>\n2) 区分主句与从句（定语/状语/宾语从句等），每个从句注明修饰谁。\n3) 每个句子/从句里标出 主语/谓语/宾语/定语/状语/补语。\n4) 修饰语用缩进挂到它的中心词下面（如"宾语 the water"下再缩进写"定语 the""中心词 water"）。\n5) 用 2 或 4 个空格缩进表示层级，越深越缩进；括号里用中文简要说明词性与作用。\n示例格式：\n## 整句：I drank the water that he had drunk\n- 主句：I drank the water\n  - 主语：I（人称代词）\n  - 谓语：drank（drink 过去式，实义动词）\n  - 宾语：the water\n    - 定语：the（定冠词，限定名词）\n    - 中心词：water（名词）\n- 定语从句：that he had drunk（修饰先行词 water）\n  - 引导词：that（关系代词，代指 water，从句作宾语）\n  - 从句主语：he（人称代词）\n  - 从句谓语：had drunk（过去完成时）\n    - 助动词：had\n    - 过去分词：drunk\n只输出上面这种 Markdown 树。';
  const r=await fetch(ep,{method:'POST',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify({model, messages:[{role:'system',content:sys},{role:'user',content:sent}]})});
  if(!r.ok) throw new Error('API '+r.status);
  const j=await r.json();
  let txt=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content||'';
  return txt.replace(/```[a-z]*\n?/gi,'').replace(/```/g,'').trim();
}
function tagLocal(sent){
  return (sent.match(/[A-Za-z]+/g)||[]).map(w=>{
    const info=wordInfo(w);
    return {word:w, pos:'', role:'', level:info&&info.cn?'小学':(info&&info.ipa?'小学':'超纲'), ipa:info?info.ipa:''};
  });
}
function splitIpaBlocks(ipa, w){
  // 把 "/wi/ /ɑr/ /ɔl/" 拆为 [<span class="ph">/wi/</span> ...]，每块点击都朗读该词
  if(!ipa) return '';
  const h=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;');
  const wH=h(w);
  const segs=ipa.split(/\s+/).map(s=>s.trim()).filter(Boolean);
  return segs.map(s=>'<span class="ph" onclick="event.stopPropagation();speakEn(\''+wH+'\');" title="朗读 '+wH+'">'+h(s)+'</span>').join(' ');
}
function renderSentence(arr){
  // 清掉之前的提示，但保留树根
  sentenceOut.innerHTML='';
  const box=document.createElement('div'); box.className='sent';
  arr.forEach(t=>{
    const hard=t.level==='超纲';
    const tok=document.createElement('span'); tok.className='tok'+(hard?' hard':'');
    const roleCls={ '主语':'subj','谓语':'pred','宾语':'obj','定语':'attr','状语':'advr','补语':'comp' }[t.role]||'other';
    const ipaHtml = t.ipa ? splitIpaBlocks(t.ipa, t.word) : '';
    tok.innerHTML='<span class="w">'+t.word+'</span>'+
      (ipaHtml?'<span class="meta ipa">'+ipaHtml+'</span>':'')+
      (t.pos?'<span class="meta">'+t.pos+'</span>':'')+
      (t.role?'<span class="role '+roleCls+'">'+t.role+'</span>':'');
    const _wi=wordInfo(t.word); if(_wi){const _o=(_wi.cn?_wi:{w:t.word.toLowerCase(),ipa:_wi.ipa}); tok.onclick=()=>openDetail(_o);}
    box.appendChild(tok);
  });
  sentenceOut.appendChild(box);
}

let _ocr=null, _ocrLoading=null;
function setScanStatus(t){ document.getElementById('scanStatus').textContent=t||''; }
async function getOCR(){
  if(_ocr) return _ocr;
  if(_ocrLoading) return _ocrLoading;            // 防止重复初始化
  _ocrLoading=new Promise(async(resolve,reject)=>{
    try{
      setScanStatus('⏳ 加载识别模型…（首次约几十 MB，请稍候，仅此一次）');
      // 从 jsDelivr（国内可直连）动态加载官方 PaddleOCR.js；wasm 也走 jsDelivr
      const mod=await import('https://cdn.jsdelivr.net/npm/@paddleocr/paddleocr-js/+esm');
      _ocr=await mod.PaddleOCR.create({
        lang:'en', ocrVersion:'PP-OCRv5',
        ortOptions:{ backend:'wasm', wasmPaths:'https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/' }
      });
      setScanStatus('✅ 模型就绪');
      resolve(_ocr);
    }catch(e){ _ocrLoading=null; setScanStatus('❌ 模型加载失败：'+(e.message||e)+'（若模型下载慢，可重试；或改用文本/语音输入）'); reject(e); }
  });
  return _ocrLoading;
}
async function doScan(file){
  try{
    const ocr=await getOCR();
    setScanStatus('🔍 识别中…');
    const res=await ocr.predict(file);
    const items=(res&&res[0]&&res[0].items)||[];
    const text=items.map(it=>it.text).join(' ').replace(/\s+/g,' ').trim();
    if(!text){ setScanStatus('⚠️ 没识别到文字，换张清晰点的图试试'); return; }
    document.getElementById('input').value=text;
    setScanStatus('✅ 识别完成，已填入输入框');
    document.getElementById('btnAnalyze').click();   // 自动分析
  }catch(e){ setScanStatus('❌ 识别失败：'+(e.message||e)); }
}
document.getElementById('btnScan').onclick=()=>document.getElementById('scanFile').click();
document.getElementById('scanFile').onchange=async(e)=>{
  const f=e.target.files&&e.target.files[0];
  if(!f) return;
  await doScan(f);
  e.target.value='';   // 允许重复选同一张
};

let book=(JSON.parse(localStorage.getItem('phx_book')||'[]'));
function addToBook(o){
  if(book.find(x=>x.w===o.w)) return;
  // 兜底：IPA-only 词入库时给 emoji/释义默认值，旧条目和新条目都显示正常
  const item = {
    w: o.w,
    ipa: o.ipa,
    em: o.em || '📘',

  };

}

    d.innerHTML='<span class="em">'+em+'</span><span><span class="w">'+o.w+'</span> <span class="cn">'+cn+' '+o.ipa+'</span></span>';

/* 讯飞连通性测试：发静音帧，显示原始响应（用于排查鉴权/服务问题） */
async function testXfConnection(){
  const c = xfCreds();
  if(!c.appid || !c.apiKey || !c.apiSecret){
    alert('请先填写讯飞三件套，再点测试');
    return;
  }
  let url;
  try{ url = await xfAuthUrl(); }catch(e){ alert('鉴权 URL 构造失败：'+(e.message||e)); return; }
  let ws, logs=[], done=false, timer;
  try{ ws = new WebSocket(url); }catch(e){ alert('WebSocket 创建失败：'+e); return; }
  const finish=(prefix)=>{
    if(done) return; done=true; clearTimeout(timer);
    try{ ws.close(); }catch(e){}
    const tail = logs.length ? logs.slice(-4).map(x=>JSON.stringify(x)).join('\n') : '(无响应)';
    alert((prefix||'测试结束')+'\n\n讯飞响应（最近 4 条）：\n'+tail+'\n\n提示：\n• code 10005/10006=鉴权失败（APIKey/Secret 错）\n• code 10010/10012/10013=服务未开通或额度用完\n• code 10004=appid 错\n• 收到 result.ws=[] 但无错=音频采集/格式问题\n• 完全无响应=网络不通');
  };
  ws.onopen = ()=>{
    const silence = new Uint8Array(1280);
    const b64=xfB64Bytes(silence);
    // 第一帧带 common.app_id + business，中帧仅 data
    ws.send(JSON.stringify({common:{app_id:c.appid}, business:{language:'en', domain:'iat'}, data:{status:0, format:'audio/L16;rate=16000', encoding:'raw', audio:b64}}));
    ws.send(JSON.stringify({data:{status:1, format:'audio/L16;rate=16000', encoding:'raw', audio:b64}}));
    ws.send(JSON.stringify({data:{status:2}}));
  };
  ws.onmessage = (ev)=>{ try{ logs.push(JSON.parse(ev.data)); }catch(e){ logs.push(ev.data); } };
  ws.onerror = ()=>finish('连接出错');
  ws.onclose = ()=>finish();
  timer = setTimeout(()=>finish('5 秒内无响应（可能鉴权失败或网络问题）'), 5000);
}
document.getElementById('setTestXf').onclick = testXfConnection;

function systemPrompt(){ return '你是小学英语辅导老师，讲解要通俗易懂、多用例子和顺口溜，照顾小学生。'+(curContext?('当前上下文：'+curContext+'。'):'')+'【重要排版约束】请用纯文本回答：不要使用任何 Markdown 符号（包括 #、##、###、**、*、-、>、反引号、数字+点列表等），用换行和空格自然排版即可；如需强调，直接写重点词；如需分点，每点单独一行即可。'; }
function renderMd(t){
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const bold=s=>s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  const lines=t.split('\n');
  const out=[]; const stack=[]; // 每层缩进值，支持按缩进嵌套
  const closeDeep=ind=>{ while(stack.length && stack[stack.length-1]>ind){ out.push('</ul>'); stack.pop(); } };
  for(const raw of lines){
    if(!raw.trim()) continue;
    const hm=raw.match(/^(#{1,3})\s+(.*)$/);
    if(hm){ closeDeep(-1); out.push('<div class="hd h'+hm[1].length+'">'+esc(hm[2])+'</div>'); continue; }
    const bm=raw.match(/^(\s*)[*\-]\s+(.*)$/);
    if(bm){
      const ind=bm[1].length;
      closeDeep(ind);
      if(!stack.length || stack[stack.length-1]<ind){ out.push('<ul>'); stack.push(ind); }
      out.push('<li>'+bold(esc(bm[2]))+'</li>');
      continue;
    }
    closeDeep(-1);
    out.push(bold(esc(raw)));
  }
  closeDeep(-1);
  return out.join('');
}
function addMsg(role,text){
  const d=document.createElement('div'); d.className='msg '+role;
  if(role==='assistant'){
    d.innerHTML=renderMd(text);
    const sp=document.createElement('span'); sp.className='speak'; sp.textContent='🔊 朗读'; sp.onclick=()=>speakEn(text); d.appendChild(sp);
  }else{
    d.textContent=text;
  }
  chatMsgs.appendChild(d); chatMsgs.scrollTop=chatMsgs.scrollHeight;
}
document.getElementById('chatQuick').addEventListener('click',e=>{ const q=e.target.getAttribute&&e.target.getAttribute('data-q'); if(q){ chatInput.value=q; openChat(); sendChat(); } });
document.getElementById('chatSend').onclick=()=>sendChat();
chatInput.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendChat(); } });
async function sendChat(){
  const text=chatInput.value.trim(); if(!text||chatBusy) return; chatInput.value='';
  addMsg('user',text); chatHistory.push({role:'user',content:text});
  chatBusy=true; document.getElementById('chatSend').disabled=true;
  const thinking=document.createElement('div'); thinking.className='msg sys'; thinking.textContent='思考中…'; chatMsgs.appendChild(thinking);
  const ep=localStorage.getItem('phx_endpoint')||'https://apihub.agnes-ai.com/v1/chat/completions';
  const key=localStorage.getItem('phx_key'); const model=localStorage.getItem('phx_model')||'agnes-2.0-flash';
  if(!key){ thinking.remove(); addMsg('system','未配置 API Key：去 ⚙ 填入 Agnes Key（免费领），或复制下面的提示词去 WorkBuddy 问：\n\n'+buildPromptForCopy(text)); chatBusy=false; document.getElementById('chatSend').disabled=false; return; }
  try{
    const r=await fetch(ep,{method:'POST',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify({model, messages:[{role:'system',content:systemPrompt()},...chatHistory]})});
    if(!r.ok) throw new Error('API '+r.status);
    const j=await r.json(); const ans=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content||'(空)';
    thinking.remove(); addMsg('assistant',ans); chatHistory.push({role:'assistant',content:ans});
  }catch(err){ thinking.remove(); addMsg('system','调用失败：'+err.message+'（检查 Key/网络，或复制提示词去 WorkBuddy 问）'); }
  finally{ chatBusy=false; document.getElementById('chatSend').disabled=false; }
}
function buildPromptForCopy(text){ return '【小学英语辅导】'+(curContext?curContext+'\n':'')+'问题：'+text; }
function copyText(t){ if(navigator.clipboard&&window.isSecureContext){ navigator.clipboard.writeText(t).catch(()=>execCopy(t)); } else execCopy(t); }
function execCopy(t){ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} ta.remove(); }
