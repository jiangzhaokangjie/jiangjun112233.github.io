<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>交互式几何探索 · 测试</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0f172a;--surface:#1e293b;--surface2:#172033;--txt:#e2e8f0;--muted:#64748b;--line:#334155;--brand:#7c3aed;--green:#059669;--orange:#ea580c;--blue:#2563eb;--yellow:#fbbf24}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt)}
.app{display:flex;flex-direction:column;height:100%;max-width:600px;margin:0 auto}
header{padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line);text-align:center;flex-shrink:0}
header h1{font-size:16px;font-weight:700}
header p{font-size:12px;color:var(--muted);margin-top:2px}
.tabs{display:flex;gap:4px;padding:6px 8px;overflow-x:auto;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{background:var(--surface2);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:5px 12px;font-size:12px;white-space:nowrap;cursor:pointer;flex-shrink:0;transition:all .15s}
.tab:active{transform:scale(.96)}
.tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.canvas-wrap{flex:1;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--bg);overflow:hidden}
#canvas{display:block;touch-action:none;cursor:default}
.canvas-info{position:absolute;top:6px;left:8px;font-size:11px;color:var(--muted);pointer-events:none}
.panel{flex-shrink:0;background:var(--surface);border-top:1px solid var(--line);max-height:38vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.panel-section{padding:8px 14px;border-bottom:1px solid var(--line)}
.panel-section:last-child{border-bottom:none}
.panel-title{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:4px}
.measure-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.measure-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:2px 0}
.measure-row .lbl{color:var(--muted)}
.measure-row .val{font-weight:600;font-family:monospace;font-size:13px}
.measure-row .val.green{color:var(--green)}
.measure-row .val.blue{color:var(--blue)}
.measure-row .val.orange{color:var(--orange)}
.measure-row .val.yellow{color:var(--yellow)}
.measure-row .val.brand{color:var(--brand)}
.formula-row{font-size:13px;font-family:monospace;padding:3px 0;color:var(--txt);line-height:1.6}
.formula-row .result{color:var(--green);font-weight:700}
.tip-box{font-size:12px;color:var(--muted);line-height:1.6;padding:6px 10px;background:var(--surface2);border-radius:8px;border-left:3px solid var(--brand)}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>📐 交互式几何探索</h1>
    <p>拖动紫色点，观察实时变化</p>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div class="canvas-wrap">
    <canvas id="canvas"></canvas>
    <div class="canvas-info" id="canvasInfo"></div>
  </div>
  <div class="panel" id="panel"></div>
</div>

<script>
/* ============================================================ *
 *  交互式几何引擎  v1.0
 *  GeoGebra 风格 · 拖动探索 · 实时测量
 * ============================================================ */

/* ---- 坐标系 ---- */
class Coord {
  constructor(w, h, scale=40, ox=0, oy=0) {
    this.w=w; this.h=h; this.scale=scale;
    this.originX = w/2 + ox*scale;
    this.originY = h/2 - oy*scale;
  }
  toScreen(x, y) { return [this.originX + x*this.scale, this.originY - y*this.scale]; }
  toMath(x, y) { return [(x - this.originX)/this.scale, (this.originY - y)/this.scale]; }
  /* 自动适配：根据所有点的边界框计算最佳 scale 和 origin */
  static autoFit(w, h, points, opts={}) {
    const padding = opts.padding || 40;
    if (!points.length) return new Coord(w, h, 40, 0, 0);
    let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
    for (const p of points) {
      if (p.x < minX) minX = p.x;
      if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.y > maxY) maxY = p.y;
    }
    // 考虑跑道圆弧的额外宽度
    if (opts.extraWidth) { maxX += opts.extraWidth; minX -= opts.extraWidth; }
    if (opts.extraHeight) { maxY += opts.extraHeight; minY -= opts.extraHeight; }
    const mathW = Math.max(maxX - minX, 1);
    const mathH = Math.max(maxY - minY, 1);
    const availW = w - padding * 2;
    const availH = h - padding * 2;
    const sx = availW / mathW;
    const sy = availH / mathH;
    let scale = Math.min(sx, sy);
    // 限制 scale 范围
    scale = Math.max(8, Math.min(scale, 60));
    // 居中：原点放在边界框中心
    const cx = (minX + maxX) / 2;
    const cy = (minY + maxY) / 2;
    const coord = new Coord(w, h, scale, 0, 0);
    coord.originX = w / 2 - cx * scale;
    coord.originY = h / 2 + cy * scale;
    return coord;
  }
}

/* ---- 几何场景 ---- */
class GeoScene {
  constructor() {
    this.points = new Map();
    this.objects = [];
    this.measurements = [];
    this.formulaFns = [];
    this.grid = true;
    this.snap = false;
    this.snapSize = 0.5;
    this.scale = 40;
    this.origin = {x:0, y:0};
    this.tips = '';
    this.title = '';
    this.desc = '';
  }
  addPoint(id, x, y, opts={}) {
    this.points.set(id, {
      id, x, y,
      label: opts.label ?? id,
      free: opts.free ?? true,
      color: opts.color || (opts.free === false ? '#64748b' : '#7c3aed'),
      depends: opts.depends || null
    });
    return this;
  }
  add(obj) { this.objects.push(obj); return this; }
  addSeg(p1, p2, opts={}) { this.add({type:'segment', p1, p2, ...opts}); return this; }
  addCircle(center, radiusPoint, opts={}) { this.add({type:'circle', center, radiusPoint, ...opts}); return this; }
  addPoly(pts, opts={}) { this.add({type:'polygon', points:pts, ...opts}); return this; }
  addAngle(p1, vertex, p2, opts={}) { this.add({type:'angle', p1, vertex, p2, ...opts}); return this; }
  addHeight(vertex, base1, base2, opts={}) { this.add({type:'height', vertex, base1, base2, ...opts}); return this; }
  addTrack(a, b, c, d, opts={}) { this.add({type:'track', A:a, B:b, C:c, D:d, ...opts}); return this; }
  addText(x, y, text, opts={}) { this.add({type:'text', x, y, text, ...opts}); return this; }
  addMeasurement(m) { this.measurements.push(m); return this; }
  addFormula(fn) { this.formulaFns.push(fn); return this; }

  getPoint(id) { return this.points.get(id); }
  movePoint(id, x, y) {
    const p = this.points.get(id);
    if (!p || !p.free) return;
    if (this.snap) {
      x = Math.round(x / this.snapSize) * this.snapSize;
      y = Math.round(y / this.snapSize) * this.snapSize;
    }
    p.x = x; p.y = y;
    this.updateDeps();
  }
  updateDeps() {
    for (const [, p] of this.points) {
      if (p.depends) { const [x, y] = p.depends(this); p.x = x; p.y = y; }
    }
  }
  /* 计算函数 */
  len(p1, p2) { const a=this.getPoint(p1), b=this.getPoint(p2); return Math.hypot(a.x-b.x, a.y-b.y); }
  ang(p1, v, p2) {
    const a=this.getPoint(p1), vtx=this.getPoint(v), b=this.getPoint(p2);
    const v1x=a.x-vtx.x, v1y=a.y-vtx.y, v2x=b.x-vtx.x, v2y=b.y-vtx.y;
    const cos=(v1x*v2x+v1y*v2y)/(Math.hypot(v1x,v1y)*Math.hypot(v2x,v2y)+1e-12);
    return Math.acos(Math.max(-1,Math.min(1,cos))) * 180 / Math.PI;
  }
  area(pts) {
    let s=0;
    for (let i=0; i<pts.length; i++) {
      const j=(i+1)%pts.length;
      const a=this.getPoint(pts[i]), b=this.getPoint(pts[j]);
      s += a.x*b.y - b.x*a.y;
    }
    return Math.abs(s)/2;
  }
  perim(pts) {
    let s=0;
    for (let i=0; i<pts.length; i++) {
      const j=(i+1)%pts.length;
      s += this.len(pts[i], pts[j]);
    }
    return s;
  }
  radius(center, pt) { return this.len(center, pt); }
  /* 垂足计算 */
  perpFoot(px, py, x1, y1, x2, y2) {
    const dx=x2-x1, dy=y2-y1, len2=dx*dx+dy*dy;
    if (len2 < 1e-12) return [x1, y1];
    const t = ((px-x1)*dx + (py-y1)*dy) / len2;
    return [x1+t*dx, y1+t*dy];
  }
  perpDist(px, py, x1, y1, x2, y2) {
    const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy);
    if (len < 1e-12) return Math.hypot(px-x1, py-y1);
    return Math.abs(dy*px - dx*py + x2*y1 - y2*x1) / len;
  }
}

/* ---- 渲染器 ---- */
class Renderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.dpr = window.devicePixelRatio || 1;
  }
  resize(w, h) {
    this.canvas.width = w * this.dpr;
    this.canvas.height = h * this.dpr;
    this.canvas.style.width = w + 'px';
    this.canvas.style.height = h + 'px';
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
  }
  clear() { this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height); }
  drawGrid(coord) {
    const ctx = this.ctx;
    ctx.strokeStyle = 'rgba(100,116,139,0.10)';
    ctx.lineWidth = 1;
    const step = coord.scale;
    for (let x = coord.originX % step; x < coord.w; x += step) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, coord.h); ctx.stroke();
    }
    for (let y = coord.originY % step; y < coord.h; y += step) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(coord.w, y); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(100,116,139,0.22)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, coord.originY); ctx.lineTo(coord.w, coord.originY);
    ctx.moveTo(coord.originX, 0); ctx.lineTo(coord.originX, coord.h);
    ctx.stroke();
  }
  drawPolygon(coord, pts, opts={}) {
    const ctx = this.ctx;
    ctx.beginPath();
    pts.forEach((p, i) => {
      const [sx, sy] = coord.toScreen(p.x, p.y);
      if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    });
    ctx.closePath();
    if (opts.fill) { ctx.fillStyle = opts.fill; ctx.fill(); }
    ctx.strokeStyle = opts.color || '#e2e8f0';
    ctx.lineWidth = opts.width || 2.5;
    if (opts.dashed) ctx.setLineDash([6, 4]);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  drawSegment(coord, p1, p2, opts={}) {
    const ctx = this.ctx;
    const [x1, y1] = coord.toScreen(p1.x, p1.y);
    const [x2, y2] = coord.toScreen(p2.x, p2.y);
    ctx.strokeStyle = opts.color || '#e2e8f0';
    ctx.lineWidth = opts.width || 2.5;
    ctx.lineCap = 'round';
    if (opts.dashed) ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.setLineDash([]);
    if (opts.label) {
      const mx=(x1+x2)/2, my=(y1+y2)/2;
      const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1;
      const offX = -dy/L * 14, offY = dx/L * 14;
      ctx.fillStyle = opts.labelColor || '#059669';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(opts.label, mx+offX, my+offY);
    }
  }
  drawCircle(coord, center, r, opts={}) {
    const ctx = this.ctx;
    const [cx, cy] = coord.toScreen(center.x, center.y);
    const sr = r * coord.scale;
    if (opts.fill) { ctx.fillStyle = opts.fill; ctx.beginPath(); ctx.arc(cx, cy, sr, 0, Math.PI*2); ctx.fill(); }
    ctx.strokeStyle = opts.color || '#e2e8f0';
    ctx.lineWidth = opts.width || 2.5;
    if (opts.dashed) ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.arc(cx, cy, sr, 0, Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
  }
  drawAngle(coord, p1, vertex, p2, opts={}) {
    const ctx = this.ctx;
    const [vx, vy] = coord.toScreen(vertex.x, vertex.y);
    const a1 = Math.atan2(p1.y - vertex.y, p1.x - vertex.x);
    const a2 = Math.atan2(p2.y - vertex.y, p2.x - vertex.x);
    // Canvas angles: y is down, so we negate
    const ca1 = -a1, ca2 = -a2;
    const r = opts.arcRadius || 22;
    ctx.strokeStyle = opts.color || '#ea580c';
    ctx.lineWidth = 2;
    ctx.beginPath();
    // Draw the smaller arc
    let diff = ca2 - ca1;
    while (diff > Math.PI) diff -= 2*Math.PI;
    while (diff < -Math.PI) diff += 2*Math.PI;
    ctx.arc(vx, vy, r, ca1, ca1 + diff, diff < 0);
    ctx.stroke();
    if (opts.label) {
      const midA = ca1 + diff / 2;
      ctx.fillStyle = opts.color || '#ea580c';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(opts.label, vx + Math.cos(midA)*(r+14), vy + Math.sin(midA)*(r+14));
    }
  }
  drawHeight(coord, scene, opts) {
    const V = scene.getPoint(opts.vertex);
    const B1 = scene.getPoint(opts.base1);
    const B2 = scene.getPoint(opts.base2);
    const [fx, fy] = scene.perpFoot(V.x, V.y, B1.x, B1.y, B2.x, B2.y);
    this.drawSegment(coord, V, {x:fx, y:fy}, {
      color: opts.color || '#2563eb',
      width: 2, dashed: true,
      label: opts.label
    });
    // 直角标记
    const [sx, sy] = coord.toScreen(fx, fy);
    const [vx, vy] = coord.toScreen(V.x, V.y);
    const dx = V.x - fx, dy = V.y - fy;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx/len, uy = dy/len;
    // 沿底边方向
    const bdx = B2.x - B1.x, bdy = B2.y - B1.y;
    const blen = Math.hypot(bdx, bdy) || 1;
    const bux = bdx/blen, buy = bdy/blen;
    const sq = 10; // 直角标记大小
    const [p1x, p1y] = coord.toScreen(fx + ux*sq/coord.scale, fy + uy*sq/coord.scale);
    const [p2x, p2y] = coord.toScreen(fx + ux*sq/coord.scale + bux*sq/coord.scale, fy + uy*sq/coord.scale + buy*sq/coord.scale);
    const [p3x, p3y] = coord.toScreen(fx + bux*sq/coord.scale, fy + buy*sq/coord.scale);
    const ctx = this.ctx;
    ctx.strokeStyle = opts.color || '#2563eb';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(p1x, p1y); ctx.lineTo(p2x, p2y); ctx.lineTo(p3x, p3y);
    ctx.stroke();
  }
  drawTrack(coord, scene, opts) {
    const A = scene.getPoint(opts.A), B = scene.getPoint(opts.B);
    const C = scene.getPoint(opts.C), D = scene.getPoint(opts.D);
    const [ax, ay] = coord.toScreen(A.x, A.y);
    const [bx, by] = coord.toScreen(B.x, B.y);
    const [cx, cy] = coord.toScreen(C.x, C.y);
    const [dx, dy] = coord.toScreen(D.x, D.y);
    const r = Math.abs(cy - ay) / 2;
    const midYR = (by + cy) / 2;
    const midYL = (ay + dy) / 2;
    const ctx = this.ctx;
    ctx.strokeStyle = opts.color || '#e2e8f0';
    ctx.lineWidth = opts.width || 2.8;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(bx, by);
    ctx.arc(bx, midYR, r, -Math.PI/2, Math.PI/2, false);
    ctx.lineTo(dx, dy);
    ctx.arc(dx, midYL, r, Math.PI/2, 3*Math.PI/2, false);
    ctx.stroke();
    // 半圆虚线辅助（宽/直径）
    ctx.setLineDash([5, 4]);
    ctx.strokeStyle = 'rgba(100,116,139,0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(bx, by); ctx.lineTo(bx, cy);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  drawPoint(coord, p, isDragging, isHover) {
    const ctx = this.ctx;
    const [sx, sy] = coord.toScreen(p.x, p.y);
    const r = isDragging ? 7.5 : (isHover ? 6.5 : 5);
    // 外圈光晕（拖动时）
    if (isDragging || isHover) {
      ctx.fillStyle = p.free ? 'rgba(124,58,237,0.25)' : 'rgba(100,116,139,0.20)';
      ctx.beginPath(); ctx.arc(sx, sy, r + 6, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();
    if (p.label) {
      ctx.fillStyle = '#e2e8f0';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText(p.label, sx, sy - 10);
    }
  }
  drawText(coord, opts) {
    const ctx = this.ctx;
    const [sx, sy] = coord.toScreen(opts.x, opts.y);
    ctx.fillStyle = opts.color || '#e2e8f0';
    ctx.font = (opts.bold ? 'bold ' : '') + (opts.size || 14) + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(opts.text, sx, sy);
  }
  render(scene, coord, dragId, hoverId) {
    this.clear();
    if (scene.grid) this.drawGrid(coord);
    // 按顺序渲染对象
    for (const obj of scene.objects) {
      switch (obj.type) {
        case 'polygon': {
          const pts = obj.points.map(id => scene.getPoint(id));
          this.drawPolygon(coord, pts, obj);
          break;
        }
        case 'segment': {
          this.drawSegment(coord, scene.getPoint(obj.p1), scene.getPoint(obj.p2), obj);
          break;
        }
        case 'circle': {
          const c = scene.getPoint(obj.center);
          const r = scene.getPoint(obj.radiusPoint);
          this.drawCircle(coord, c, scene.radius(obj.center, obj.radiusPoint), obj);
          break;
        }
        case 'angle': {
          this.drawAngle(coord, scene.getPoint(obj.p1), scene.getPoint(obj.vertex), scene.getPoint(obj.p2), obj);
          break;
        }
        case 'height': {
          this.drawHeight(coord, scene, obj);
          break;
        }
        case 'track': {
          this.drawTrack(coord, scene, obj);
          break;
        }
        case 'text': {
          this.drawText(coord, obj);
          break;
        }
      }
    }
    // 渲染所有点
    for (const [, p] of scene.points) {
      this.drawPoint(coord, p, p.id === dragId, p.id === hoverId);
    }
  }
}

/* ---- 交互引擎 ---- */
class Engine {
  constructor(canvas) {
    this.canvas = canvas;
    this.renderer = new Renderer(canvas);
    this.scene = null;
    this.coord = null;
    this.dragId = null;
    this.hoverId = null;
    this.pointerId = null;
    this.onUpdate = null;
    this.setupEvents();
  }
  load(scene) {
    this.scene = scene;
    scene.updateDeps();  // 初始化依赖点位置
    this.resize();
    this.render();
    if (this.onUpdate) this.onUpdate();
  }
  resize() {
    const wrap = this.canvas.parentElement;
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    this.renderer.resize(w, h);
    // 自动适配：根据所有点边界框计算最佳 scale 和 origin
    const pts = [];
    for (const [, p] of this.scene.points) { pts.push({x:p.x, y:p.y}); }
    // 跑道需要考虑圆弧半径（半圆向外鼓出宽的一半）
    let extraW = 0, extraH = 0;
    const hasTrack = this.scene.objects.some(o => o.type === 'track');
    if (hasTrack) {
      // 找到宽的最大值
      let maxW = 0;
      for (const o of this.scene.objects) {
        if (o.type === 'track') {
          const w1 = this.scene.len(o.A, o.D);
          const w2 = this.scene.len(o.B, o.C);
          maxW = Math.max(maxW, w1, w2);
        }
      }
      extraW = maxW / 2; // 半圆半径
    }
    // 圆需要考虑半径
    for (const o of this.scene.objects) {
      if (o.type === 'circle') {
        const r = this.scene.radius(o.center, o.radiusPoint);
        const c = this.scene.getPoint(o.center);
        // 扩展边界
        pts.push({x: c.x + r, y: c.y});
        pts.push({x: c.x - r, y: c.y});
        pts.push({x: c.x, y: c.y + r});
        pts.push({x: c.x, y: c.y - r});
      }
    }
    this.coord = Coord.autoFit(w, h, pts, {padding: 50, extraWidth: extraW, extraHeight: extraH});
    this.render();
  }
  /* 拖动后重新适配画布（保证图形始终完整可见） */
  refit() {
    if (!this.scene) return;
    const wrap = this.canvas.parentElement;
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    const pts = [];
    for (const [, p] of this.scene.points) { pts.push({x:p.x, y:p.y}); }
    let extraW = 0, extraH = 0;
    const hasTrack = this.scene.objects.some(o => o.type === 'track');
    if (hasTrack) {
      let maxW = 0;
      for (const o of this.scene.objects) {
        if (o.type === 'track') {
          const w1 = this.scene.len(o.A, o.D);
          const w2 = this.scene.len(o.B, o.C);
          maxW = Math.max(maxW, w1, w2);
        }
      }
      extraW = maxW / 2;
    }
    for (const o of this.scene.objects) {
      if (o.type === 'circle') {
        const r = this.scene.radius(o.center, o.radiusPoint);
        const c = this.scene.getPoint(o.center);
        pts.push({x: c.x + r, y: c.y}, {x: c.x - r, y: c.y}, {x: c.x, y: c.y + r}, {x: c.x, y: c.y - r});
      }
    }
    this.coord = Coord.autoFit(w, h, pts, {padding: 50, extraWidth: extraW, extraHeight: extraH});
  }
  hitTest(sx, sy) {
    if (!this.scene) return null;
    const hitR = 22; // 触摸热区
    let best = null, bestDist = hitR;
    for (const [, p] of this.scene.points) {
      if (!p.free) continue;
      const [px, py] = this.coord.toScreen(p.x, p.y);
      const d = Math.hypot(sx - px, sy - py);
      if (d < bestDist) { bestDist = d; best = p.id; }
    }
    return best;
  }
  setupEvents() {
    const c = this.canvas;
    const getPos = (e) => {
      const rect = c.getBoundingClientRect();
      return [e.clientX - rect.left, e.clientY - rect.top];
    };
    // 统一用 pointer 事件（现代浏览器鼠标+触摸都走 pointer）
    const onDown = (e) => {
      if (!this.scene) return;
      e.preventDefault();
      const [x, y] = getPos(e);
      const id = this.hitTest(x, y);
      if (id) {
        this.dragId = id;
        this.pointerId = e.pointerId;
        try { c.setPointerCapture(e.pointerId); } catch(_) {}
        c.style.cursor = 'grabbing';
        this.render();
      }
    };
    const onMove = (e) => {
      if (!this.scene) return;
      const [x, y] = getPos(e);
      if (this.dragId) {
        e.preventDefault();
        const [mx, my] = this.coord.toMath(x, y);
        this.scene.movePoint(this.dragId, mx, my);
        this.refit();
        this.render();
        if (this.onUpdate) this.onUpdate();
      } else {
        const id = this.hitTest(x, y);
        if (id !== this.hoverId) {
          this.hoverId = id;
          c.style.cursor = id ? 'grab' : 'default';
          this.render();
        }
      }
    };
    const endDrag = (e) => {
      if (this.dragId) {
        this.dragId = null;
        c.style.cursor = this.hoverId ? 'grab' : 'default';
        this.render();
      }
    };
    c.addEventListener('pointerdown', onDown);
    c.addEventListener('pointermove', onMove);
    c.addEventListener('pointerup', endDrag);
    c.addEventListener('pointercancel', endDrag);
    c.addEventListener('pointerleave', () => {
      if (!this.dragId) { this.hoverId = null; c.style.cursor = 'default'; this.render(); }
    });
    // 后备：旧版浏览器 mouse 事件
    c.addEventListener('mousedown', onDown);
    c.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', endDrag);
    // 触摸后备（防止 pointer 不支持）
    c.addEventListener('touchstart', (e) => {
      if (!this.scene) return;
      const t = e.touches[0];
      if (!t) return;
      e.preventDefault();
      const [x, y] = getPos(t);
      const id = this.hitTest(x, y);
      if (id) {
        this.dragId = id;
        this.render();
      }
    }, {passive:false});
    c.addEventListener('touchmove', (e) => {
      if (!this.scene || !this.dragId) return;
      const t = e.touches[0];
      if (!t) return;
      e.preventDefault();
      const [x, y] = getPos(t);
      const [mx, my] = this.coord.toMath(x, y);
      this.scene.movePoint(this.dragId, mx, my);
      this.refit();
      this.render();
      if (this.onUpdate) this.onUpdate();
    }, {passive:false});
    c.addEventListener('touchend', endDrag);
    c.addEventListener('touchcancel', endDrag);
  }
  render() {
    if (!this.scene || !this.coord) return;
    this.renderer.render(this.scene, this.coord, this.dragId, this.hoverId);
    // 更新坐标信息
    const info = document.getElementById('canvasInfo');
    if (this.dragId) {
      const p = this.scene.getPoint(this.dragId);
      info.textContent = `${p.label}: (${p.x.toFixed(1)}, ${p.y.toFixed(1)})`;
    } else {
      info.textContent = '';
    }
  }
}

/* ============================================================ *
 *  应用初始化
 * ============================================================ */

const canvas = document.getElementById('canvas');
const engine = new Engine(canvas);
const tabsEl = document.getElementById('tabs');
const panelEl = document.getElementById('panel');
let currentKey = 'rect';

// 创建标签
Object.keys(PROBLEMS).forEach(key => {
  const btn = document.createElement('button');
  btn.className = 'tab';
  btn.textContent = PROBLEMS[key].title;
  btn.dataset.key = key;
  btn.onclick = () => switchTo(key);
  tabsEl.appendChild(btn);
});

function switchTo(key) {
  currentKey = key;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.key === key);
  });
  const scene = PROBLEMS[key].create();
  engine.load(scene);
}

// 测量面板更新
engine.onUpdate = () => updatePanel();

function updatePanel() {
  const s = engine.scene;
  if (!s) return;
  let html = '';
  // 测量
  if (s.measurements.length) {
    html += '<div class="panel-section"><div class="panel-title">📏 实时测量</div><div class="measure-grid">';
    for (const m of s.measurements) {
      let val = 0;
      switch (m.type) {
        case 'length': val = s.len(m.p1, m.p2); break;
        case 'angle': val = s.ang(m.p1, m.vertex, m.p2); break;
        case 'area': val = s.area(m.polygon); break;
        case 'perimeter': val = s.perim(m.polygon); break;
        case 'radius': val = s.radius(m.center, m.point); break;
        case 'custom': val = m.calc(s); break;
      }
      const unit = m.unit || '';
      const cls = m.cls || '';
      const display = m.type === 'angle' ? val.toFixed(1) + '°' : val.toFixed(2) + ' ' + unit;
      html += `<div class="measure-row"><span class="lbl">${m.label}</span><span class="val ${cls}">${display}</span></div>`;
    }
    html += '</div></div>';
  }
  // 公式
  if (s.formulaFns.length) {
    html += '<div class="panel-section"><div class="panel-title">📝 公式验证</div>';
    for (const fn of s.formulaFns) {
      html += `<div class="formula-row">${fn(s)}</div>`;
    }
    html += '</div>';
  }
  // 提示
  if (s.tips) {
    html += `<div class="panel-section"><div class="panel-title">💡 探索提示</div><div class="tip-box">${s.tips}</div></div>`;
  }
  panelEl.innerHTML = html;
}
